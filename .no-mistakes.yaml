# Per-repo no-mistakes overrides for the Fleet control-plane plugin.

commands:
  test: pnpm install --frozen-lockfile && pnpm test
  lint: pnpm install --frozen-lockfile && pnpm run typecheck && pnpm run build

test:
  evidence:
    attach_media: false
    store_in_repo: false

document:
  instructions: |
    Update README.md and docs/ when CLI surfaces, overlay apply paths, or M1
    acceptance steps change. Keep packages/bb-backend/overlay docs aligned with
    lib/apply-firstmate-integration.ts.
