# Per-repo no-mistakes overrides for the Fleet control-plane plugin.

commands:
  test: |
    pnpm install --frozen-lockfile && pnpm test
    bash scripts/no-mistakes-test-live.sh
  lint: pnpm install --frozen-lockfile && pnpm run typecheck

test:
  evidence:
    attach_media: false
    store_in_repo: false
  instructions: |
    Baseline command runs `pnpm test` (unit + bb-backend/spawn-wrap/fm-teardown shell contracts).
    When `scripts/resolve-bb-cli.sh` finds bb, `scripts/no-mistakes-test-live.sh` runs
    `scripts/p-u19-live-rpc.sh` (live RPC — same transport as the Fleet Tree UI).

    For the scenario table in your test report, use this compact shape (do not duplicate
    14+ operator rows that only repeat lib/*.test.ts with live=false — the analyzer
    rejects that as untested noise):

    1. **Automated behavioral suite** — result pass, live=false, evidence=targeted node --test log
       (mate reset, meta sync, sweep, archive sync, fm-teardown contract via pnpm test).
    2. **Live P-U19 RPC script** — one row per check ID from p-u19-live-rpc.sh when the script
       ran; result pass/fail, live=true, evidence=script stdout.
    3. **Manual / out of gate** — Tree UI click path and preflight Retry UX only; result skip
       (not untested), reason=requires BB plugin renderer session.

    Omit adversarial paths already covered by lib/fleet-mate-reset.test.ts unless you add a new
    executable test. Verdict **go** when baseline passes and live script passes or was skipped
    only because bb was unavailable after resolve-bb-cli.

document:
  instructions: |
    Update README.md and docs/ when CLI surfaces, overlay apply paths, or M1
    acceptance steps change. Keep packages/bb-backend/overlay docs aligned with
    lib/apply-firstmate-integration.ts.
